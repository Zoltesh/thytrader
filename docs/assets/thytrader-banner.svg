<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="ThyTrader: neon candlesticks on your laptop, an agent co-pilot, a moon, and gold T-coins">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04151c"/>
      <stop offset="40%" stop-color="#12081f"/>
      <stop offset="100%" stop-color="#2a0830"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ce1b5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5ce1b5" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe58a"/>
      <stop offset="100%" stop-color="#f0a202"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffd24a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaBloom" cx="0.7" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#ff2d95" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintBloom" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#5ce1b5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5ce1b5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="380" rx="32" fill="url(#sky)"/>
  <rect width="1000" height="380" rx="32" fill="url(#magentaBloom)"/>
  <rect width="1000" height="380" rx="32" fill="url(#mintBloom)"/>
  <rect x="2" y="2" width="996" height="376" rx="30" fill="none" stroke="#5ce1b5" stroke-width="4"/>
  <rect x="10" y="10" width="980" height="360" rx="24" fill="none" stroke="#ff2d95" stroke-opacity="0.45" stroke-width="2"/>

  <!-- neon floor grid -->
  <g opacity="0.55" stroke="url(#gridFade)" stroke-width="1.5">
    <path d="M0 250 L1000 250"/>
    <path d="M0 278 L1000 278"/>
    <path d="M0 308 L1000 308"/>
    <path d="M0 340 L1000 340"/>
    <path d="M80 220 L0 380"/>
    <path d="M200 220 L80 380"/>
    <path d="M320 220 L200 380"/>
    <path d="M440 220 L360 380"/>
    <path d="M560 220 L560 380"/>
    <path d="M680 220 L800 380"/>
    <path d="M800 220 L980 380"/>
    <path d="M920 220 L1100 380"/>
  </g>

  <!-- moon -->
  <circle cx="888" cy="72" r="48" fill="url(#moonGlow)"/>
  <circle cx="888" cy="72" r="28" fill="#fff3c4"/>
  <circle cx="898" cy="64" r="7" fill="#f0d48a" opacity="0.7"/>
  <circle cx="876" cy="80" r="5" fill="#f0d48a" opacity="0.55"/>
  <circle cx="892" cy="86" r="4" fill="#e8c56a" opacity="0.5"/>

  <!-- stars -->
  <g fill="#fff8d6">
    <circle cx="70" cy="38" r="2.4"/>
    <circle cx="140" cy="58" r="1.6"/>
    <circle cx="410" cy="32" r="2"/>
    <circle cx="640" cy="44" r="1.8"/>
    <circle cx="760" cy="28" r="2.2"/>
    <circle cx="960" cy="120" r="1.7"/>
  </g>
  <path fill="#5ce1b5" d="M118 24l3 7.2 7.6.6-5.8 5 1.8 7.4L118 40l-6.6 4.2 1.8-7.4-5.8-5 7.6-.6z"/>
  <path fill="#ff2d95" d="M968 40l2.4 6 6.2.4-4.8 4.2 1.4 6.2L968 53l-5.4 3.4 1.4-6.2-4.8-4.2 6.2-.4z"/>
  <path fill="#3ee0ff" d="M500 22l2 5 5.4.4-4.2 3.6 1.2 5.2L500 33l-4.4 2.8 1.2-5.2-4.2-3.6 5.4-.4z"/>

  <!-- rocket candle (left) -->
  <g transform="translate(42 70)">
    <rect x="86" y="18" width="22" height="150" rx="4" fill="#5ce1b5"/>
    <line x1="97" y1="0" x2="97" y2="18" stroke="#e9fff6" stroke-width="4" stroke-linecap="round"/>
    <path fill="#ff8a3d" d="M86 168l11 42 11-42z"/>
    <path fill="#ff2d95" d="M92 168l5 28 5-28z"/>
    <rect x="46" y="88" width="18" height="80" rx="3" fill="#ff7a93"/>
    <line x1="55" y1="70" x2="55" y2="88" stroke="#ffd0d8" stroke-width="3"/>
    <rect x="126" y="58" width="18" height="110" rx="3" fill="#5ce1b5"/>
    <rect x="158" y="40" width="18" height="128" rx="3" fill="#3ee0ff"/>
    <rect x="190" y="74" width="18" height="94" rx="3" fill="#b794f6"/>
    <path fill="none" stroke="#ffd24a" stroke-width="4" stroke-linecap="round" d="M40 200 C90 188, 130 140, 170 92 S230 30, 250 8"/>
  </g>

  <!-- laptop (center) -->
  <g transform="translate(300 78)">
    <rect x="40" y="6" width="268" height="168" rx="18" fill="#0b1418" stroke="#5ce1b5" stroke-width="5"/>
    <rect x="54" y="20" width="240" height="140" rx="10" fill="#05080a"/>
    <rect x="150" y="28" width="28" height="28" rx="8" fill="#5ce1b5"/>
    <path fill="#07100e" d="M157 33h14v6h-4v16h-6V39h-4z"/>
    <rect x="74" y="108" width="12" height="36" fill="#5ce1b5"/>
    <rect x="92" y="92" width="12" height="52" fill="#ff2d95"/>
    <rect x="110" y="78" width="12" height="66" fill="#5ce1b5"/>
    <rect x="128" y="64" width="12" height="80" fill="#3ee0ff"/>
    <rect x="146" y="84" width="12" height="60" fill="#ff7a93"/>
    <rect x="164" y="54" width="12" height="90" fill="#5ce1b5"/>
    <rect x="182" y="46" width="12" height="98" fill="#ffd24a"/>
    <rect x="200" y="70" width="12" height="74" fill="#b794f6"/>
    <rect x="218" y="38" width="12" height="106" fill="#5ce1b5"/>
    <rect x="236" y="58" width="12" height="86" fill="#ff2d95"/>
    <rect x="22" y="174" width="304" height="16" rx="6" fill="#223038"/>
    <rect x="4" y="188" width="340" height="14" rx="7" fill="#5ce1b5"/>
    <text x="174" y="156" text-anchor="middle" fill="#5ce1b5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">127.0.0.1</text>
  </g>

  <!-- agent -->
  <g transform="translate(680 86)">
    <line x1="86" y1="4" x2="86" y2="36" stroke="#ff2d95" stroke-width="6" stroke-linecap="round"/>
    <circle cx="86" cy="2" r="9" fill="#5ce1b5"/>
    <rect x="36" y="40" width="100" height="82" rx="30" fill="#2a1050" stroke="#b794f6" stroke-width="4"/>
    <circle cx="68" cy="74" r="9" fill="#3ee0ff"/>
    <circle cx="104" cy="74" r="9" fill="#3ee0ff"/>
    <circle cx="70" cy="73" r="3" fill="#04151c"/>
    <circle cx="106" cy="73" r="3" fill="#04151c"/>
    <path fill="none" stroke="#fff6c8" stroke-width="5" stroke-linecap="round" d="M62 100c14 16 34 16 48 0"/>
    <rect x="54" y="130" width="64" height="48" rx="16" fill="#ff2d95"/>
    <rect x="14" y="142" width="30" height="14" rx="7" fill="#5ce1b5"/>
    <rect x="128" y="142" width="30" height="14" rx="7" fill="#ffd24a"/>
  </g>

  <!-- T-coins -->
  <g>
    <circle cx="250" cy="318" r="26" fill="url(#gold)" stroke="#fff3c4" stroke-width="3"/>
    <path fill="#3a2200" d="M241 308h18v6h-6v18h-6v-18h-6z"/>
    <circle cx="318" cy="334" r="18" fill="url(#gold)" stroke="#fff3c4" stroke-width="2"/>
    <path fill="#3a2200" d="M312 326h12v4h-4v12h-4v-12h-4z"/>
    <circle cx="638" cy="326" r="22" fill="url(#gold)" stroke="#fff3c4" stroke-width="3"/>
    <path fill="#3a2200" d="M630 317h16v5h-5.5v16h-5v-16H630z"/>
  </g>
</svg>
