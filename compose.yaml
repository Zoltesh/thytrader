# ThyTrader's clone-and-run local stack. Every published host port is loopback-only.
# Run `uv run python scripts/setup_local_stack.py` from the repository root.

x-backend-environment: &backend-environment
  THYTRADER_ENVIRONMENT: production
  THYTRADER_CONTAINERIZED: "true"
  THYTRADER_DATABASE_URL: ${THYTRADER_COMPOSE_DATABASE_URL:-postgresql+asyncpg://thytrader:thytrader-local-development-only@postgres:5432/thytrader}
  THYTRADER_SNAPSHOT_INTERVAL_SECONDS: ${THYTRADER_SNAPSHOT_INTERVAL_SECONDS:-300}
  THYTRADER_COINBASE_API_KEY_NAME: ${THYTRADER_COINBASE_API_KEY_NAME:-}
  THYTRADER_COINBASE_API_PRIVATE_KEY: ${THYTRADER_COINBASE_API_PRIVATE_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    container_name: thytrader-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${THYTRADER_PG_USER:-thytrader}
      # This is a local-development fallback only. The bootstrap helper creates
      # matching ignored .env settings for a different local credential.
      POSTGRES_PASSWORD: ${THYTRADER_PG_PASSWORD:-thytrader-local-development-only}
      POSTGRES_DB: ${THYTRADER_PG_DB:-thytrader}
    volumes:
      - thytrader_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${THYTRADER_PG_USER:-thytrader} -d ${THYTRADER_PG_DB:-thytrader}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *backend-environment
      THYTRADER_API_HOST: 0.0.0.0
      THYTRADER_API_PORT: "8200"
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8200/health/ready', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/.venv/bin/thytrader-worker"]
    environment:
      <<: *backend-environment
      THYTRADER_WORKER_READINESS_FILE: /tmp/thytrader-worker.ready
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "from pathlib import Path; raise SystemExit(not Path('/tmp/thytrader-worker.ready').is_file())",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      THYTRADER_API_PROXY_TARGET: http://api:8200
    ports:
      - "127.0.0.1:5175:5175"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5175').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  thytrader_pg_data:
