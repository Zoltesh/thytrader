[project]
name = "thytrader"
version = "0.1.0"
description = "A trustworthy, local-first trading workstation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "coinbase-advanced-py>=1.8.4",
    "fastapi>=0.140.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "polars>=1.43.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.51.0",
    "websockets>=13.1,<14",
]

[project.scripts]
thytrader-api = "thytrader.api.cli:main"
thytrader-worker = "thytrader.worker.cli:main"
thytrader-market-data-worker = "thytrader.market_data_worker.cli:main"
thytrader-research-evaluate = "thytrader.research.cli:main"
thytrader-research-run = "thytrader.research.run_cli:main"
thytrader-backtest = "thytrader.backtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]

[tool.ruff]
required-version = ">=0.16.0"
target-version = "py314"
line-length = 100
extend-exclude = [
    ".gitnexus",
]
show-fixes = true

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "D",      # pydocstyle
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle errors
    "ERA",    # eradicate commented-out code
    "EXE",    # flake8-executable
    "F",      # Pyflakes
    "FAST",   # FastAPI
    "FLY",    # flynt
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # Perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PLC",    # Pylint conventions
    "PLE",    # Pylint errors
    "PLW",    # Pylint warnings
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
ignore = [
    "ANN401", # Explicit Any is allowed at tightly controlled external boundaries.
    "D105",   # Magic methods are self-documenting when their class is documented.
    "TRY003", # Clear exception messages may be defined at the raise site.
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["thytrader"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # Pytest uses assert statements by design.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"
